<text x="18" y="26" font-size="15" font-weight="bold" fill="#222">When the bot starts talking</text>
<text x="18" y="43" font-size="11" fill="#555">80 turn ends from AMI meetings replayed in Pipecat; response time = turn-end decision + 0.8 s of LLM latency.</text>
<text x="18" y="58" font-size="11" fill="#555">Bars: share of turn ends per 0.2 s. Curve: smoothed density (Gaussian kernel, 0.12 s).</text>
<rect x="18" y="82" width="11" height="11" rx="2" fill="#E69F00"/>
<text x="36" y="92" font-size="13.5" font-weight="bold" fill="#222">Stock Smart Turn v3.2</text>
<text x="702" y="92" font-size="11" fill="#222" text-anchor="end">p50 <tspan font-weight="bold">1.03 s</tspan>  ·  p90 <tspan font-weight="bold">4.00 s</tspan>  ·  mean <tspan font-weight="bold">1.89 s</tspan></text>
<text x="18" y="108" font-size="10.5" fill="#555">one query 0.2 s after the user stops, then a 3 s backstop</text>
<text x="18" y="123" font-size="10.5" fill="#b57a00" font-weight="bold">two modes: 70 % at 1.0–1.2 s, 30 % at 3.8–4.2 s</text>
