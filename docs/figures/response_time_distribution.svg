<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" font-family="Helvetica, Arial, sans-serif">
<style>text { paint-order: stroke; stroke: #ffffff; stroke-width: 3px; stroke-linejoin: round; }</style>
<rect width="960" height="360" fill="#ffffff"/>
<text x="18" y="24" font-size="15" font-weight="bold" fill="#222">When the bot starts talking: response times on 80 turn ends</text>
<text x="18" y="40" font-size="11" fill="#555">AMI meetings replayed in real time through Pipecat; response time = turn-end decision + 0.8 s of LLM latency. Bars: share of turn ends per 0.2 s.</text>
<rect x="18" y="70" width="10" height="10" rx="2" fill="#E69F00"/>
<text x="34" y="80" font-size="13" font-weight="bold" fill="#222">Stock Smart Turn v3.2</text>
<text x="18" y="95" font-size="10.5" fill="#555">one query 0.2 s after the user stops, then a 3 s backstop</text>
<text x="18" y="118" font-size="10" fill="#777">p50 / p90 / mean</text>
<text x="18" y="132" font-size="12" font-weight="bold" fill="#222">1.03 / 4.00 / 1.89 s</text>
<text x="300" y="88" font-size="10" fill="#333">70 % at 1.0–1.2 s and 30 % at 3.8–4.2 s (the backstop): fast or late, nothing in between</text>
<line x1="300" y1="142" x2="900" y2="142" stroke="#ddd"/>
<rect x="301.0" y="114.9" width="31.3" height="27.1" rx="2" fill="#E69F00"/>
<text x="316.7" y="110.9" font-size="9.5" fill="#444" text-anchor="middle">41 %</text>
<rect x="334.3" y="123.9" width="31.3" height="18.1" rx="2" fill="#E69F00"/>
<text x="350.0" y="119.9" font-size="9.5" fill="#444" text-anchor="middle">28 %</text>
<rect x="367.7" y="141.2" width="31.3" height="0.8" rx="2" fill="#E69F00"/>
<rect x="801.0" y="128.9" width="31.3" height="13.1" rx="2" fill="#E69F00"/>
<text x="816.7" y="124.9" font-size="9.5" fill="#444" text-anchor="middle">20 %</text>
<rect x="834.3" y="136.2" width="31.3" height="5.8" rx="2" fill="#E69F00"/>
<text x="850.0" y="132.2" font-size="9.5" fill="#444" text-anchor="middle">9 %</text>
<rect x="867.7" y="141.2" width="31.3" height="0.8" rx="2" fill="#E69F00"/>
<line x1="18" y1="166" x2="942" y2="166" stroke="#eee"/>
<rect x="18" y="182" width="10" height="10" rx="2" fill="#0072B2"/>
<text x="34" y="192" font-size="13" font-weight="bold" fill="#222">Smart Turn Streaming, two stages</text>
<text x="18" y="207" font-size="10.5" fill="#555">decides at 0.2 / 0.5 / 1.2 s; eager start, then commit</text>
<text x="18" y="230" font-size="10" fill="#777">p50 / p90 / mean</text>
<text x="18" y="244" font-size="12" font-weight="bold" fill="#222">1.31 / 2.04 / 1.55 s</text>
<text x="300" y="200" font-size="10" fill="#333">68 % under 1.5 s (the answer is ready when the commit lands), 25 % at 2.0 s (no eager fired), 8 % on the backstop</text>
<line x1="300" y1="254" x2="900" y2="254" stroke="#ddd"/>
<rect x="301.0" y="246.6" width="31.3" height="7.4" rx="2" fill="#0072B2"/>
<text x="316.7" y="242.6" font-size="9.5" fill="#444" text-anchor="middle">11 %</text>
<rect x="334.3" y="245.8" width="31.3" height="8.2" rx="2" fill="#0072B2"/>
<text x="350.0" y="241.8" font-size="9.5" fill="#444" text-anchor="middle">12 %</text>
<rect x="367.7" y="226.1" width="31.3" height="27.9" rx="2" fill="#0072B2"/>
<text x="383.3" y="222.1" font-size="9.5" fill="#444" text-anchor="middle">42 %</text>
<rect x="401.0" y="252.4" width="31.3" height="1.6" rx="2" fill="#0072B2"/>
<rect x="467.7" y="243.3" width="31.3" height="10.7" rx="2" fill="#0072B2"/>
<text x="483.3" y="239.3" font-size="9.5" fill="#444" text-anchor="middle">16 %</text>
<rect x="501.0" y="249.1" width="31.3" height="4.9" rx="2" fill="#0072B2"/>
<rect x="634.3" y="252.4" width="31.3" height="1.6" rx="2" fill="#0072B2"/>
<rect x="667.7" y="252.4" width="31.3" height="1.6" rx="2" fill="#0072B2"/>
<rect x="767.7" y="253.2" width="31.3" height="0.8" rx="2" fill="#0072B2"/>
<rect x="834.3" y="253.2" width="31.3" height="0.8" rx="2" fill="#0072B2"/>
<line x1="300" y1="284" x2="900" y2="284" stroke="#333"/>
<line x1="333.3" y1="284" x2="333.3" y2="290" stroke="#333"/><text x="333.3" y="302" font-size="10" fill="#333" text-anchor="middle">1 s</text>
<line x1="500.0" y1="284" x2="500.0" y2="290" stroke="#333"/><text x="500.0" y="302" font-size="10" fill="#333" text-anchor="middle">2 s</text>
<line x1="666.7" y1="284" x2="666.7" y2="290" stroke="#333"/><text x="666.7" y="302" font-size="10" fill="#333" text-anchor="middle">3 s</text>
<line x1="833.3" y1="284" x2="833.3" y2="290" stroke="#333"/><text x="833.3" y="302" font-size="10" fill="#333" text-anchor="middle">4 s</text>
<text x="600" y="318" font-size="10" fill="#666" text-anchor="middle">seconds from the user's last word to the bot's first audio</text>
<text x="18" y="350" font-size="10" fill="#777">Same 80 turn ends, same 0.8 s of LLM latency. Colours: Okabe–Ito palette (colour-blind safe).</text>
</svg>