<text x="702" y="346" font-size="11" fill="#222" text-anchor="end">p50 <tspan font-weight="bold">1.31 s</tspan>  ·  p90 <tspan font-weight="bold">2.04 s</tspan>  ·  mean <tspan font-weight="bold">1.55 s</tspan></text>
